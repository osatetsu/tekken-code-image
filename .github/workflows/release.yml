name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build plugin assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: npm run build

      - name: Read built manifest version
        id: read_manifest
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('dist/manifest.json','utf8')).version")
          echo "Detected manifest version: $version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Verify manifest version matches tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.read_manifest.outputs.value }}
        run: |
          expected="${TAG#v}"
          if [ "$VERSION" != "$expected" ]; then
            echo "::error::manifest.json version ($VERSION) does not match tag ($expected)"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tekken-code-image-${{ github.ref_name }}
          path: |
            dist/main.js
            dist/manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/main.js

  release:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: tekken-code-image-${{ github.ref_name }}
          path: dist
          if-no-files-found: error

      - name: Read description from manifest
        id: read_description
        run: |
          set -euo pipefail
          desc=$(node -p "JSON.parse(require('fs').readFileSync('dist/manifest.json','utf8')).description ?? ''")
          desc=$(printf '%s' "$desc" | tr -d '\n')
          if [ -z "$desc" ]; then
            desc="Automated release of tekken-code-image (${{ github.ref_name }})."
          fi
          {
            echo "value<<EOF"
            echo "$desc"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.read_description.outputs.value }}
          files: |
            dist/main.js
            dist/manifest.json
          fail_on_unmatched_files: true
