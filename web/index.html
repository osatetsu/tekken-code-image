<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tekken Code Image</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 16px;
    }
    .layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 20px;
    }
    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; }
    }
    .main-panel { display: flex; flex-direction: column; gap: 16px; }
    .sidebar {
      background: #16213e;
      border-radius: 8px;
      padding: 16px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .sidebar h2 { font-size: 1.1rem; margin-bottom: 12px; }
    .sidebar h3 { font-size: 1rem; margin: 16px 0 8px; }
    .input-section textarea {
      width: 100%;
      min-height: 80px;
      background: #16213e;
      border: 1px solid #30475e;
      border-radius: 6px;
      color: #e0e0e0;
      font-family: "Cascadia Code", "Fira Code", monospace;
      font-size: 16px;
      padding: 12px;
      resize: vertical;
    }
    .input-section textarea:focus { outline: none; border-color: #4a6fa5; }
    .examples {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .example-btn {
      background: #30475e;
      border: none;
      border-radius: 4px;
      color: #e0e0e0;
      padding: 4px 10px;
      font-size: 0.8rem;
      cursor: pointer;
      font-family: "Cascadia Code", "Fira Code", monospace;
    }
    .example-btn:hover { background: #4a6fa5; }
    .output-section {
      background: #16213e;
      border-radius: 8px;
      padding: 24px;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: auto;
    }
    #svg-output svg { max-width: 100%; height: auto; }
    .toolbar { display: flex; gap: 8px; }
    .toolbar button {
      background: #4a6fa5;
      border: none;
      border-radius: 4px;
      color: #fff;
      padding: 6px 16px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .toolbar button:hover { background: #5a7fb5; }
    .setting-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .setting-row label {
      flex: 0 0 auto;
      font-size: 0.85rem;
      min-width: 80px;
    }
    .setting-row input[type="number"],
    .setting-row input[type="text"] {
      width: 80px;
      background: #1a1a2e;
      border: 1px solid #30475e;
      border-radius: 4px;
      color: #e0e0e0;
      padding: 3px 6px;
      font-size: 0.85rem;
    }
    .setting-row input[type="text"] { width: 120px; }
    .setting-row input[type="color"] {
      width: 32px;
      height: 24px;
      border: 1px solid #30475e;
      border-radius: 4px;
      cursor: pointer;
      background: none;
    }
    .setting-row input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
    .setting-desc {
      font-size: 0.7rem;
      color: #888;
      width: 100%;
      padding-left: 80px;
      margin-top: -6px;
    }
    .restore-btn {
      background: #c0392b !important;
      margin-top: 12px;
    }
    .restore-btn:hover { background: #e74c3c !important; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Tekken Code Image</h1>
    <div class="layout">
      <div class="main-panel">
        <div class="input-section">
          <textarea id="dsl-input" placeholder="例: 6n23RP" spellcheck="false"></textarea>
        </div>
        <div class="examples" id="examples"></div>
        <div class="toolbar">
          <button id="download-btn">Download SVG</button>
        </div>
        <div class="output-section">
          <div id="svg-output"></div>
        </div>
      </div>
      <div class="sidebar">
        <h2>Settings</h2>
        <div id="settings-panel"></div>
      </div>
    </div>
  </div>
  <script src="./main.js"></script>
</body>
</html>
